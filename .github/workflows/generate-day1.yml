name: Generate Day 1 assignment files
on:
  push:
    paths:
      - ".github/workflows/generate-day1.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate all 15 task folders
        run: |
          python - <<'PY'
          from pathlib import Path
          tasks = [
          ("Set-1-Retail-Order-Desk","01-order-search",'''import csv,time
          from pathlib import Path
          def linear(a,x):
           for r in a:
            if int(r["orderId"])==x:return r
          def binary(a,x):
           lo,hi=0,len(a)-1
           while lo<=hi:
            m=(lo+hi)//2;v=int(a[m]["orderId"])
            if v==x:return a[m]
            if v<x:lo=m+1
            else:hi=m-1
          if __name__=="__main__":
           p=Path("orders.csv")
           if p.exists():
            with p.open(newline="",encoding="utf-8") as f:a=list(csv.DictReader(f))
           else:a=[{"orderId":i,"customerId":i%7000,"amount":(i*37)%5000+100,"createdAt":f"2026-10-{i%28+1:02d}T10:{i%60:02d}:00"} for i in range(50000)]
           a.sort(key=lambda r:int(r["orderId"]));x=int(a[-1]["orderId"])
           for fn in (linear,binary):
            t=time.perf_counter();print(fn.__name__,fn(a,x) is not None,"ms",round((time.perf_counter()-t)*1000,3))
           print("records",len(a))''',"Linear O(n); binary O(log n) after sorting. Reads orders.csv or creates 50,000 demo orders."),
          ("Set-1-Retail-Order-Desk","02-order-sorting",'''import random
          def bubble(a):
           a=a[:];tr=[]
           for i in range(len(a)-1):
            changed=False
            for j in range(len(a)-1-i):
             if a[j]<a[j+1]:a[j],a[j+1]=a[j+1],a[j];changed=True
            if i<3:tr.append(a[:])
            if not changed:break
           return a,tr
          def merge(a):
           if len(a)<=1:return a[:]
           m=len(a)//2;l=merge(a[:m]);r=merge(a[m:]);o=[];i=j=0
           while i<len(l) and j<len(r):
            if l[i]>=r[j]:o.append(l[i]);i+=1
            else:o.append(r[j]);j+=1
           return o+l[i:]+r[j:]
          if __name__=="__main__":
           a=[120,450,80,300,200,510,150];b,t=bubble(a)
           print("input",a)
           for i,p in enumerate(t,1):print("pass",i,p)
           print("bubble",b,"merge",merge(a))
           x=random.Random(42).sample(range(100000),10000)
           print("merge matches built-in",merge(x)==sorted(x,reverse=True))''',"Bubble O(n²); merge/built-in O(n log n). First three bubble passes shown."),
          ("Set-1-Retail-Order-Desk","03-duplicate-orders",'''from collections import defaultdict
          def find(rows):
           d=defaultdict(list);out=[]
           for r in rows:
            k=(r["customerId"],round(float(r["amount"]),2),r["createdAt"][:16])
            for old in d[k]:out.append((old["orderId"],r["orderId"]))
            d[k].append(r)
           return out
          if __name__=="__main__":
           a=[{"orderId":"O1","customerId":"C7","amount":250,"createdAt":"2026-10-14T10:31:05"},{"orderId":"O2","customerId":"C7","amount":250,"createdAt":"2026-10-14T10:31:48"},{"orderId":"O3","customerId":"C7","amount":250,"createdAt":"2026-10-14T10:32:01"}]
           print("duplicate pairs",find(a))''',"Composite hash key: customer + amount + minute. Average O(n) time and O(n) space."),
          ("Set-1-Retail-Order-Desk","04-stack-queue",'''from collections import deque
          class Stack:
           def __init__(s):s.a=[]
           def push(s,x):s.a.append(x)
           def pop(s):return s.a.pop()
          class Queue:
           def __init__(s):s.a=[]
           def enqueue(s,x):s.a.append(x)
           def dequeue(s):return s.a.pop(0)
          if __name__=="__main__":
           s=Stack()
           for x in ["address edit","quantity edit","coupon edit"]:s.push(x)
           print("undo",s.pop())
           q=Queue()
           for x in ["O1","O2","O3"]:q.enqueue(x)
           print("dispatch",q.dequeue(),q.dequeue(),q.dequeue())
           d=deque(["O1","O2"]);print("deque",d.popleft())''',"Stack LIFO; queue FIFO. Stack O(1); list queue dequeue O(n); deque popleft O(1) approx."),
          ("Set-1-Retail-Order-Desk","05-refund-change",'''def greedy(n,coins):
           out=[]
           for c in sorted(coins,reverse=True):
            q,n=divmod(n,c);out += [c]*q
           return out if n==0 else None
          def dp(n,coins):
           d=[n+1]*(n+1);pick=[0]*(n+1);d[0]=0
           for v in range(1,n+1):
            for c in coins:
             if c<=v and d[v-c]+1<d[v]:d[v]=d[v-c]+1;pick[v]=c
           if d[n]>n:return None
           out=[]
           while n:out.append(pick[n]);n-=pick[n]
           return out
          if __name__=="__main__":
           print("greedy 6",greedy(6,[4,3,1]));print("DP 6",dp(6,[4,3,1]))''',"Greedy fails for 6 with [4,3,1]: 4+1+1; DP finds 3+3. DP O(amount × coins)."),
          ("Set-2-Retail-Banking","01-transaction-search",'''def linear(a,x):
           c=0
           for v in a:
            c+=1
            if v==x:return c
           return c
          def binary(a,x):
           l,h=0,len(a)-1;c=0
           while l<=h:
            m=(l+h)//2;c+=1
            if a[m]==x:return c
            if a[m]<x:l=m+1
            else:h=m-1
           return c
          if __name__=="__main__":
           a=list(range(100000))
           for name,x in [("best",0),("middle",50000),("last",99999),("absent",100001)]:print(name,"linear",linear(a,x),"binary",binary(a,x))''',"Linear best O(1), average/worst O(n); binary best O(1), average/worst O(log n), sorted IDs required."),
          ("Set-2-Retail-Banking","02-statement-sorting",'''def insertion(a):
           a=a[:]
           for i in range(1,len(a)):
            x=a[i];j=i-1
            while j>=0 and a[j]["date"]>x["date"]:a[j+1]=a[j];j-=1
            a[j+1]=x
           return a
          def merge(a):
           if len(a)<=1:return a[:]
           m=len(a)//2;l=merge(a[:m]);r=merge(a[m:]);o=[];i=j=0
           while i<len(l) and j<len(r):
            if l[i]["date"]<=r[j]["date"]:o.append(l[i]);i+=1
            else:o.append(r[j]);j+=1
           return o+l[i:]+r[j:]
          if __name__=="__main__":
           a=[{"id":"T1","date":"09:00"},{"id":"T2","date":"08:30"},{"id":"T3","date":"09:00"}]
           for f in (insertion,merge):print([(x["id"],x["date"]) for x in f(a)])''',"Both stable; equal timestamps preserve input order. Insertion O(n²); merge O(n log n), O(n) space."),
          ("Set-2-Retail-Banking","03-duplicate-postings",'''from collections import defaultdict
          from datetime import datetime
          def find(rows):
           d=defaultdict(list);out=[]
           for r in rows:
            k=(r["account"],float(r["amount"]),r["merchant"]);t=datetime.fromisoformat(r["time"])
            for old,ot in d[k]:
             if abs((t-ot).total_seconds())<=60:out.append((old["id"],r["id"]))
            d[k].append((r,t))
           return out
          if __name__=="__main__":
           a=[{"id":"P1","account":"A1","amount":499,"merchant":"Cafe","time":"2026-10-14T10:00:00"},{"id":"P2","account":"A1","amount":499,"merchant":"Cafe","time":"2026-10-14T10:00:45"},{"id":"P3","account":"A1","amount":499,"merchant":"Cafe","time":"2026-10-14T10:02:00"}]
           print("duplicate pairs",find(a))''',"Hash by account/amount/merchant then check 60 seconds. Average O(n) plus group comparisons; O(n) space."),
          ("Set-2-Retail-Banking","04-review-queue-stack",'''class Queue:
           def __init__(s):s.a=[]
           def enqueue(s,x):s.a.append(x)
           def dequeue(s):return s.a.pop(0)
          class Stack:
           def __init__(s):s.a=[]
           def push(s,x):s.a.append(x)
           def pop(s):return s.a.pop()
          if __name__=="__main__":
           q=Queue()
           for x in ["TX100","TX101","TX102"]:q.enqueue(x)
           print("FIFO",q.dequeue(),q.dequeue(),q.dequeue())
           s=Stack()
           for x in ["fee +10","interest -5","correction +2"]:s.push(x)
           print("undo",s.pop())''',"FIFO review queue; LIFO adjustment stack. Stack O(1); list queue dequeue O(n)."),
          ("Set-2-Retail-Banking","05-divide-conquer-min-max",'''def minmax(a):
           if not a:raise ValueError("empty")
           if len(a)==1:return a[0],a[0]
           if len(a)==2:return min(a),max(a)
           m=len(a)//2;x,y=minmax(a[:m]);u,v=minmax(a[m:])
           return min(x,u),max(y,v)
          if __name__=="__main__":
           a=[1200.5,99,450.25,9999,18.75,2300,650]
           print("divide/conquer",minmax(a));print("brute force",(min(a),max(a)))''',"Divide-and-conquer O(n), O(log n) recursion; brute force O(n), O(1) extra."),
          ("Set-3-Hospital-Appointment-Desk","01-patient-search",'''import random,time
          def linear(a,x):
           for r in a:
            if r["id"]==x:return r
          def binary(a,x):
           l,h=0,len(a)-1
           while l<=h:
            m=(l+h)//2
            if a[m]["id"]==x:return a[m]
            if a[m]["id"]<x:l=m+1
            else:h=m-1
          if __name__=="__main__":
           a=[{"id":i,"name":f"Patient-{i}"} for i in range(20000)]
           targets=[random.Random(7+i).randrange(20000) for i in range(1000)]
           for name,f in [("linear",linear),("binary",binary)]:
            t=time.perf_counter()
            for x in targets:f(a,x)
            print(name,"1000 lookups ms",round((time.perf_counter()-t)*1000,3))''',"Linear O(n), binary O(log n) per lookup; sorted patient IDs required. Timings vary by machine."),
          ("Set-3-Hospital-Appointment-Desk","02-urgency-sorting",'''def key(x):return (x["urgency"],x["arrival"])
          def selection(a):
           a=a[:];sw=0
           for i in range(len(a)-1):
            m=min(range(i,len(a)),key=lambda j:key(a[j]))
            if m!=i:a[i],a[m]=a[m],a[i];sw+=1
           return a,sw
          def quick(a):
           a=a[:];sw=0
           def part(l,h):
            nonlocal sw
            p=key(a[h]);i=l-1
            for j in range(l,h):
             if key(a[j])<=p:
              i+=1
              if i!=j:a[i],a[j]=a[j],a[i];sw+=1
            if i+1!=h:a[i+1],a[h]=a[h],a[i+1];sw+=1
            return i+1
           def sort(l,h):
            if l<h:
             p=part(l,h);sort(l,p-1);sort(p+1,h)
           sort(0,len(a)-1);return a,sw
          if __name__=="__main__":
           a=[{"patient":"A","urgency":2,"arrival":3},{"patient":"B","urgency":1,"arrival":5},{"patient":"C","urgency":1,"arrival":2},{"patient":"D","urgency":3,"arrival":1}]
           for n,f in [("selection",selection),("quick",quick)]:
            x,s=f(a);print(n,[(z["patient"],key(z)) for z in x],"swaps",s)''',"Sort by (urgency, arrival), 1 is most urgent. Selection O(n²); quicksort average O(n log n), worst O(n²)."),
          ("Set-3-Hospital-Appointment-Desk","03-double-bookings",'''def find(a):
           seen=set();out=[]
           for r in a:
            k=(r["patient_id"],r["slot"])
            if k in seen:out.append(k)
            else:seen.add(k)
           return out
          if __name__=="__main__":
           a=[{"patient_id":"P10","slot":"10:00"},{"patient_id":"P11","slot":"10:00"},{"patient_id":"P10","slot":"10:00"},{"patient_id":"P10","slot":"10:30"}]
           print("double bookings",find(a))''',"Hash set detects duplicate patient/slot keys in average O(n) time and O(n) space."),
          ("Set-3-Hospital-Appointment-Desk","04-walkin-queue-stack",'''class Queue:
           def __init__(s):s.a=[]
           def enqueue(s,x):s.a.append(x)
           def dequeue(s):return s.a.pop(0)
          class Stack:
           def __init__(s):s.a=[]
           def push(s,x):s.a.append(x)
           def pop(s):return s.a.pop()
          if __name__=="__main__":
           q=Queue()
           for x in ["W01","W02","W03"]:q.enqueue(x)
           print("walk-in FIFO",q.dequeue(),q.dequeue(),q.dequeue())
           s=Stack()
           for x in ["P10","P20","P30"]:s.push(x)
           print("most recent",s.pop())''',"Walk-in queue FIFO; recently viewed stack LIFO. Stack O(1); list queue removal O(n)."),
          ("Set-3-Hospital-Appointment-Desk","05-appointment-dp",'''from bisect import bisect_right
          def dp(jobs):
           a=sorted(jobs,key=lambda x:x[1]);ends=[x[1] for x in a];p=[]
           for i,(s,e,n) in enumerate(a):p.append(bisect_right(ends,s,0,i)-1)
           d=[0]*(len(a)+1)
           for i in range(1,len(a)+1):d[i]=max(d[i-1],1+d[p[i-1]+1])
           out=[];i=len(a)
           while i:
            if 1+d[p[i-1]+1]>d[i-1]:out.append(a[i-1][2]);i=p[i-1]+1
            else:i-=1
           return d[-1],out[::-1]
          def greedy(jobs):
           out=[]
           for x in sorted(jobs,key=lambda z:z[1]):
            if not out or x[0]>=out[-1][1]:out.append(x)
           return len(out),[x[2] for x in out]
          if __name__=="__main__":
           a=[(0,4,"A"),(1,2,"B"),(2,5,"C"),(4,7,"D"),(5,9,"E"),(7,8,"F")]
           print("DP",dp(a));print("greedy",greedy(a))''',"DP take/skip O(n log n), O(n) space. Earliest-finish greedy is also optimal for unweighted maximum-count scheduling.")
          ]
          for set_name,slug,code,note in tasks:
              folder=Path(set_name)/slug
              folder.mkdir(parents=True,exist_ok=True)
              (folder/"task.py").write_text(codewrap(code),encoding="utf-8")
              (folder/"output.txt").write_text("Run python task.py for the sample output. "+note+"\n",encoding="utf-8")
              (folder/"flowchart.svg").write_text(svg(slug,note),encoding="utf-8")
          def codewrap(s):
              lines=s.splitlines()
              return "\n".join(line[10:] if line.startswith("          ") else line for line in lines)+"\n"
          def svg(slug,note):
              import html
              label=html.escape(slug.replace("-"," "))
              return f'''<svg xmlns="http://www.w3.org/2000/svg" width="820" height="190"><rect width="820" height="190" rx="14" fill="#f8fafc"/><g font-family="Arial" text-anchor="middle"><rect x="20" y="50" width="130" height="60" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="85" y="85">Input</text><path d="M150 80h65m-8-8 8 8-8 8" stroke="#334155" fill="none"/><rect x="220" y="50" width="200" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="320" y="85">{label}</text><path d="M420 80h65m-8-8 8 8-8 8" stroke="#334155" fill="none"/><rect x="490" y="50" width="130" height="60" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="555" y="85">Check / Update</text><path d="M620 80h45m-8-8 8 8-8 8" stroke="#334155" fill="none"/><rect x="670" y="50" width="130" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed"/><text x="735" y="85">Result</text><text x="410" y="150" font-size="11" fill="#475569">{html.escape(note[:110])}</text></g></svg>'''
          (Path("README.md")).write_text("""# Day 1 – Problem Solving Techniques and Data Structures I

          Mavericks Segue 2026 | Python Track | 14 October 2026

          ## Sets
          - Set 1 – Retail Order Desk (5 tasks)
          - Set 2 – Retail Banking Transaction Review (5 tasks)
          - Set 3 – Hospital Appointment Desk (5 tasks)

          Every task folder contains task.py, output.txt and flowchart.svg. Run a task using python task.py (Python 3.9+, no third-party packages).

          Set 1 Task 1 reads orders.csv beside the script when present; otherwise it creates 50,000 deterministic demo records. Use the trainer CSV for the actual benchmark. Timing varies by machine.
          """,encoding="utf-8")
          PY
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md Set-1-Retail-Order-Desk Set-2-Retail-Banking Set-3-Hospital-Appointment-Desk
          git commit -m "Add all Day 1 task solutions, outputs and flowcharts" || echo "No changes"
          git push
